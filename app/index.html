<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f766e">
<title>Axeom Today</title>
<style>
  :root {
    --bg: #f6f7f5; --card: #ffffff; --ink: #16201d; --muted: #5d6b66; --line: #e2e6e3;
    --accent: #0f766e; --accent-ink: #ffffff; --soft: #e7f3f1;
    --red: #b42318; --red-soft: #fdecea; --amber: #a15c07; --amber-soft: #fdf3e1; --blue: #1d4ed8; --blue-soft: #e8efff;
    --radius: 14px; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1412; --card: #17201d; --ink: #e8eeeb; --muted: #9aa8a2; --line: #26322e;
      --accent: #2bb3a3; --accent-ink: #06221f; --soft: #13302c;
      --red: #ff8a80; --red-soft: #3a1d1b; --amber: #f5b75a; --amber-soft: #35280f; --blue: #8fb1ff; --blue-soft: #1a2442;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1412; --card: #17201d; --ink: #e8eeeb; --muted: #9aa8a2; --line: #26322e;
    --accent: #2bb3a3; --accent-ink: #06221f; --soft: #13302c;
    --red: #ff8a80; --red-soft: #3a1d1b; --amber: #f5b75a; --amber-soft: #35280f; --blue: #8fb1ff; --blue-soft: #1a2442;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
  main { max-width: 560px; margin: 0 auto; padding: 14px 16px 120px; }
  h1 { font-size: 15px; font-weight: 600; color: var(--muted); margin: 4px 0 14px; display: flex; justify-content: space-between; gap: 8px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 26px 0 10px; font-weight: 700; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 10px; }
  .first { border: 2px solid var(--accent); padding: 18px; }
  .first .q { font-size: 21px; line-height: 1.3; font-weight: 700; margin: 8px 0 8px; }
  .q { font-weight: 600; margin: 4px 0 6px; overflow-wrap: anywhere; }
  .why { color: var(--muted); font-size: 14px; margin: 0 0 12px; overflow-wrap: anywhere; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .tag.client { background: var(--red-soft); color: var(--red); }
  .tag.edit { background: var(--blue-soft); color: var(--blue); }
  .tag.money { background: var(--amber-soft); color: var(--amber); }
  .tag.lead { background: var(--soft); color: var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button, .btn { font: inherit; border: 0; border-radius: 10px; padding: 12px 16px; min-height: 46px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
  .yes { background: var(--accent); color: var(--accent-ink); font-weight: 700; flex: 1 1 auto; }
  .no { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .ghost { background: transparent; color: var(--accent); padding: 8px 0; min-height: 0; font-weight: 600; }
  .compact { padding: 12px 14px; }
  .compact .q { font-size: 15px; }
  .compact button { min-height: 40px; padding: 8px 14px; font-size: 15px; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 10px; text-align: left; color: var(--ink); flex-direction: column; align-items: flex-start; min-height: 74px; }
  .tile b { font-size: 18px; display: block; }
  .tile span { font-size: 12.5px; color: var(--muted); }
  input[type=search] { width: 100%; font: inherit; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .list a { display: block; padding: 12px 2px; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; }
  .list a small { color: var(--muted); display: block; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .bar .in { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
  .bar .yes { flex: 1; }
  .sheet { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; z-index: 10; }
  .sheet main { padding-top: 8px; }
  .back { background: transparent; color: var(--accent); font-weight: 700; padding: 10px 0; min-height: 0; }
  textarea { width: 100%; min-height: 150px; font: inherit; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .note { font-size: 13px; color: var(--muted); }
  .toast { position: fixed; left: 16px; right: 16px; bottom: 86px; max-width: 528px; margin: 0 auto; background: var(--ink); color: var(--bg); padding: 12px 14px; border-radius: 10px; z-index: 20; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 7px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
  .bad { color: var(--red); font-weight: 600; }
  .ok { color: var(--accent); }
  .muted { color: var(--muted); }
  .done { opacity: .55; }
  details summary { cursor: pointer; color: var(--accent); font-weight: 600; padding: 6px 0; }
  .empty { text-align: center; padding: 26px 10px; }
  @media (max-width: 360px) { .tiles { grid-template-columns: 1fr 1fr; } .first .q { font-size: 19px; } }
</style>
</head>
<body>
<div id="app"><main><p class="muted">Loading…</p></main></div>
<input id="file" type="file" multiple accept=".csv,.txt,text/csv,text/plain" hidden>
<script src="engine.js"></script>
<script src="base-data.js"></script>
<script src="app.js"></script>
</body>
</html>
